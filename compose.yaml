services:
  # 常驻服务：页面访问 + /healthz 健康响应。
  # 宿主端口可配置：HOST_PORT=9090 docker compose up web
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: relay-channel-matching:web
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # 单次校验服务：实际运行匹配规则测试、页面构建与本题输入的 HTTP 冒烟，
  # 完成后以退出码结束（0 通过；非 0 失败）。
  # 用法：docker compose build verify && docker compose run --rm verify
  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    image: relay-channel-matching:verify
    environment:
      HOST: 127.0.0.1
    restart: "no"
